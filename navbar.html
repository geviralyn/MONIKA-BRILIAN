<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<style>
    :root {
    /* PRIMARY */
  --primary: #6C4BCF;
  --primary-dark: #5A3FC0;
  --primary-light: #8B73E6;

    --gold: #C8973A;
    --gold-light: #E8B84B;
    --gold-pale: #F5E9CC;
    --dark: #1A1A2E;
    --dark2: #16213E;
    --navy: #0F3460;
    --purple: #B1B3E5;
    --purple-dark: #6c4bcf;
    --cream: #FFF9EF;
    --cream2: #FFF9EF;
    --white: #FFFFFF;
    --gray: #6B7280;
    --gray-light: #E5E7EB;
    --text: #2D2D2D;
    --green: #2E7D32;
    /* TEXT */
  --text: #1A1A1A;
  --text-light: #555;
  --text-muted: #8A8A8A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
     /* ─── NAVBAR ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(200,151,58,0.15);
    padding: 0 5%;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    animation: slideDown 0.6s ease both;
  }
  @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--dark); text-decoration: none; }
  .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 20px; height: 20px; fill: white; }

  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a { text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: var(--primary); }

  .nav-cta {
    background: var(--primary);
    color: white; border: none; padding: 10px 22px; border-radius: 8px;
    font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 0.88rem;
    cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 12px rgba(108,75,207,0.3);
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(108,75,207,0.45); }
</style>
<body>
   <!-- NAVBAR -->
<nav class="navbar">
  <a class="logo" href="#">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    BRILIAN
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Beranda</a></li>
    <li><a href="#">Tentang Kami</a></li>
    <li><a href="#">Layanan</a></li>
    <li><a href="#">Sertifikasi</a></li>
    <li><a href="#">Kontak</a></li>
  </ul>
  <button class="nav-cta">Konsultasi Gratis</button>
</nav> 
</body>
</html>
